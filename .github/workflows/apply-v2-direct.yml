name: Apply verified MKUU v2 fixes
on:
  push:
    branches: [fix/used-model-init]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current-search fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server/geminiService.ts')
          s=p.read_text()
          if "export const LIVE_SEARCH_MODEL" not in s:
              s=s.replace("export const PERSONAL_CHAT_MODEL = 'gemini-3.7-flash';\nexport const BACKEND_IDENTIFIER", "export const PERSONAL_CHAT_MODEL = 'gemini-3.7-flash';\nexport const LIVE_SEARCH_MODEL = 'gemini-2.5-flash';\nexport const BACKEND_IDENTIFIER")
          s=s.replace("    let aiReplyText = '';\n    let usedModel = PERSONAL_CHAT_MODEL;", "    const usedModel = isSearchQuery ? LIVE_SEARCH_MODEL : PERSONAL_CHAT_MODEL;\n\n    let aiReplyText = '';")
          s=s.replace("    console.log(`[MKUU-BACKEND] [GEMINI_REQUEST_STARTED] provider=\"${AI_PROVIDER}\" model=\"${usedModel}\" searchGrounding=${isSearchQuery}`);\n\n    let aiReplyText = '';\n    const usedModel = isSearchQuery ? LIVE_SEARCH_MODEL : PERSONAL_CHAT_MODEL;", "    const usedModel = isSearchQuery ? LIVE_SEARCH_MODEL : PERSONAL_CHAT_MODEL;\n\n    console.log(`[MKUU-BACKEND] [GEMINI_REQUEST_STARTED] provider=\"${AI_PROVIDER}\" model=\"${usedModel}\" searchGrounding=${isSearchQuery}`);\n\n    let aiReplyText = '';")
          s=s.replace("preferredModel: PERSONAL_CHAT_MODEL,", "preferredModel: usedModel,", 1)
          s=s.replace("model=\"${PERSONAL_CHAT_MODEL}\" searchGrounding=${isSearchQuery}", "model=\"${usedModel}\" searchGrounding=${isSearchQuery}")
          old="""      if (isRateLimit) {\n        aiReplyText = `Mkuu wangu **Max**, seva za Gemini zimepata msongamano wa muda mfupi wa maombi (Rate Limit Quota). \n\nTafadhali subiri sekunde chache kisha ubonyeze **'JARIBU TENA'** au unitumie ujumbe tena, nitaendelea kukuhudumia mara moja.`;\n      } else {\n        throw new Error(`Google Gemini API (${PERSONAL_CHAT_MODEL}) Error: ${err?.message || 'Huduma haikupatikana kwa sasa'}`);\n      }"""
          new="""      if (isSearchQuery) {\n        throw new Error(`GOOGLE_SEARCH_REQUIRED: Live Google Search failed (${LIVE_SEARCH_MODEL}). MKUU will not answer this current-information question from stale model memory. ${errMsg}`);\n      }\n      if (isRateLimit) {\n        aiReplyText = `Mkuu wangu **Max**, seva za Gemini zimepata msongamano wa muda mfupi wa maombi (Rate Limit Quota). Tafadhali jaribu tena.`;\n      } else {\n        throw new Error(`Google Gemini API (${PERSONAL_CHAT_MODEL}) Error: ${err?.message || 'Huduma haikupatikana kwa sasa'}`);\n      }"""
          if old in s: s=s.replace(old,new,1)
          old="""    const preferred = params.preferredModel || PERSONAL_CHAT_MODEL;\n    const modelsToTry = [preferred, ...CHAT_MODEL_FALLBACKS.filter((m) => m !== preferred)];"""
          new="""    const preferred = params.preferredModel || PERSONAL_CHAT_MODEL;\n    const modelsToTry = params.config?.tools ? [preferred] : [preferred, ...CHAT_MODEL_FALLBACKS.filter((m) => m !== preferred)];"""
          if old in s: s=s.replace(old,new,1)
          start=s.find("        // If tools (search grounding) caused quota limit")
          if start>=0:
              end=s.find("        // Quick single wait", start)
              if end>=0: s=s[:start]+s[end:]
          s=s.replace("chatModel: PERSONAL_CHAT_MODEL,\n      latencyMs,", "chatModel: usedModel,\n      latencyMs,", 1)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/geminiService.ts
          if ! git diff --cached --quiet; then git commit -m "fix: initialize usedModel before logging"; git push; fi