name: Apply verified MKUU v2 fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe Gemini service fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('server/geminiService.ts')
          s = p.read_text()

          # Keep exactly one live-search model declaration and use Gemini 3.6 Flash.
          s = re.sub(r"^export const LIVE_SEARCH_MODEL\s*=\s*[^;]+;\s*$\n?", "", s, flags=re.MULTILINE)
          marker = "export const PERSONAL_CHAT_MODEL = 'gemini-3.7-flash';"
          if marker not in s:
              raise SystemExit('PERSONAL_CHAT_MODEL declaration not found')
          s = s.replace(
              marker,
              marker + "\nexport const LIVE_SEARCH_MODEL = 'gemini-3.6-flash';",
              1,
          )

          # server.ts and agentEngine.ts import this named singleton.
          singleton = "export const geminiService = GeminiService.getInstance();"
          if singleton not in s:
              s = s.rstrip() + "\n\n" + singleton + "\n"

          p.write_text(s)
          PY
      - name: Verify Gemini service exports
        run: |
          grep -n "PERSONAL_CHAT_MODEL\|LIVE_SEARCH_MODEL\|geminiService = GeminiService.getInstance" server/geminiService.ts
          test "$(grep -c "export const LIVE_SEARCH_MODEL" server/geminiService.ts)" -eq 1
          grep -q "export const LIVE_SEARCH_MODEL = 'gemini-3.6-flash';" server/geminiService.ts
          grep -q "export const geminiService = GeminiService.getInstance();" server/geminiService.ts
      - name: Build backend to catch TypeScript/esbuild export errors
        run: |
          npm ci
          npm run build
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/geminiService.ts .github/workflows/apply-v2-direct.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Gemini service singleton export"
            git push
          fi
