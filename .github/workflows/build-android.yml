name: MKUU AI — Android Release APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  GRADLE_VERSION: "8.13"
  ANDROID_API: "36"

jobs:
  build-android:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;36.0.0"

      - name: 6. Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"

          rm -rf "$GRADLE_HOME"

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          "$GRADLE_HOME/bin/gradle" --version

      - name: 7. Verify Java Node Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "===== NODE ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

      - name: 8. Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: 9. Verify Capacitor
        shell: bash
        run: |
          set -euo pipefail

          npx cap --version

          test -d node_modules/@capacitor/android
          test -d android

          echo "Capacitor Android project detected."

      - name: 10. Build Web Application
        shell: bash
        run: |
          set -euo pipefail

          npm run build

      - name: 11. Verify Web Assets
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html

          echo "Web build OK:"
          ls -lah dist/

      - name: 12. Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: 13. Repair Invalid Launcher PNG Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repairing Android launcher PNG resources..."

          python3 <<'PY'
          import base64
          import pathlib

          png_b64 = """
          
          """

          data = base64.b64decode("".join(png_b64.split()))

          root = pathlib.Path("android/app/src/main/res")

          files = list(root.glob("mipmap-*/ic_launcher.png"))
          files += list(root.glob("mipmap-*/ic_launcher_foreground.png"))

          for file in files:
              file.write_bytes(data)
              print(f"Repaired: {file}")

          print(f"Repaired {len(files)} launcher PNG files.")
          PY

          echo "Launcher PNG repair complete."

      - name: 14. Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "===== Capacitor settings ====="
          if [ -f android/capacitor.settings.gradle ]; then
            cat android/capacitor.settings.gradle
          fi

          echo "===== Android project ====="
          find android -maxdepth 2 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print

      - name: 15. Verify Launcher PNGs
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking launcher PNG files..."

          PNG_COUNT=0

          while IFS= read -r file; do
            if [ ! -s "$file" ]; then
              echo "ERROR: Empty PNG: $file"
              exit 1
            fi

            FILE_TYPE="$(file -b "$file")"

            echo "$file -> $FILE_TYPE"

            echo "$FILE_TYPE" | grep -qi "PNG image data" || {
              echo "ERROR: Invalid PNG: $file"
              exit 1
            }

            PNG_COUNT=$((PNG_COUNT + 1))
          done < <(
            find android/app/src/main/res \
              -type f \
              \( -name "ic_launcher.png" -o -name "ic_launcher_foreground.png" \) \
              -print
          )

          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "ERROR: No launcher PNG files found."
            exit 1
          fi

          echo "Verified $PNG_COUNT launcher PNG files."

      - name: 16. Clean Android Project
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: 17. Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: 18. Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit 2>/dev/null || true
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."

            find android/app/build/outputs \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: 19. Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print | sort -V | tail -1
          )"

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          mkdir -p release-output

          ALIGNED_APK="$RUNNER_TEMP/MkuuAI-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/mkuu-ai-release.keystore"

          "$ZIPALIGN" -f 4 \
            "$APK_PATH" \
            "$ALIGNED_APK"

          if [ -n "${KEYSTORE_B64:-}" ] && \
             [ -n "${KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${KEY_PASSWORD:-}" ] && \
             [ -n "${KEY_ALIAS:-}" ]; then

            echo "Using configured release signing key."

            printf '%s' "$KEYSTORE_B64" \
              | base64 --decode > "$KEYSTORE"

            SIGN_STOREPASS="$KEYSTORE_PASSWORD"
            SIGN_KEYPASS="$KEY_PASSWORD"
            SIGN_ALIAS="$KEY_ALIAS"

          else

            echo "No signing secrets configured."
            echo "Creating temporary CI signing key."

            SIGN_STOREPASS="$(openssl rand -hex 24)"
            SIGN_KEYPASS="$SIGN_STOREPASS"
            SIGN_ALIAS="mkuu_ai_key"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "$SIGN_STOREPASS" \
              -keypass "$SIGN_KEYPASS" \
              -alias "$SIGN_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Mkuu AI, OU=MkuuAI, O=Mkuu, L=Dar es Salaam, ST=Tanzania, C=TZ"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass "pass:$SIGN_STOREPASS" \
            --key-pass "pass:$SIGN_KEYPASS" \
            --out "release-output/MkuuAI_Master_v1.0.0_Signed.apk" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify \
            --verbose \
            "release-output/MkuuAI_Master_v1.0.0_Signed.apk"

      - name: 20. Validate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          test -s "$APK"

          SIZE="$(wc -c < "$APK")"

          if [ "$SIZE" -le 10000 ]; then
            echo "ERROR: APK is unexpectedly small: $SIZE bytes"
            exit 1
          fi

          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"

          echo "=============================================="
          echo "BUILD SUCCESSFUL"
          echo "APK: MkuuAI_Master_v1.0.0_Signed.apk"
          echo "SIZE: $SIZE bytes"
          echo "=============================================="

      - name: 21. Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: error
