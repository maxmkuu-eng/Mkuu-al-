# SMS direct-send + delivery validation build
name: Build and Validate Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify-apk:
    name: Build, Sign & Validate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: 4. Build Production Web Assets and Sync Android
        run: npm run build && npx cap sync android

      - name: 5. Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 6. Configure Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 7. Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.13'

      - name: 8. Verify Installed Gradle
        run: gradle --version

      - name: 9. Build Production Android APK (:app:assembleRelease)
        run: cd android && gradle clean :app:assembleRelease --no-daemon --stacktrace

      - name: 10. Align and Sign Production Release APK
        run: |
          mkdir -p release-output
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$RAW_APK" && test -f "$RAW_APK"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          export PATH="$BUILD_TOOLS_DIR:$PATH"
          zipalign -v -p 4 "$RAW_APK" release-output/aligned_unsigned.apk
          keytool -genkey -v -keystore release.keystore -alias mkuu_ai_master_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "MkuuAiMasterRelease2026" -keypass "MkuuAiMasterRelease2026" -dname "CN=Max, OU=MKUU AI, O=MKUU, L=DarEsSalaam, ST=Tanzania, C=TZ"
          apksigner sign --ks release.keystore --ks-pass pass:MkuuAiMasterRelease2026 --key-pass pass:MkuuAiMasterRelease2026 --ks-key-alias mkuu_ai_master_key --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out release-output/MkuuAI_Master_v1.0.3_Signed.apk release-output/aligned_unsigned.apk

      - name: 11. Strict APK Inspection
        run: |
          TARGET_APK=release-output/MkuuAI_Master_v1.0.3_Signed.apk
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          export PATH="$BUILD_TOOLS_DIR:$PATH"
          test -f "$TARGET_APK"
          apksigner verify --verbose --print-certs "$TARGET_APK"
          aapt dump badging "$TARGET_APK" | head -n 35
          zipalign -c -v 4 "$TARGET_APK"

      - name: 12. Upload Verified Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.3_Signed.apk
          path: release-output/MkuuAI_Master_v1.0.3_Signed.apk
          retention-days: 30
          if-no-files-found: error
