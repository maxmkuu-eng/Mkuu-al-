name: Build and Validate Android Release APK

on:
  push:- name: 4. Prepare Gradle
  uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: '8.13'
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify-apk:
    name: Build, Sign & Validate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configure Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 4. Verify and Prepare Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 5. Verify Gradle Version
        run: |
          cd android
          echo "=========================================="
          echo "Verifying Gradle Wrapper Version:"
          echo "=========================================="
          ./gradlew --version

      - name: 6. Pre-Build Verification: Gradle Projects
        run: |
          cd android
          echo "=========================================="
          echo "Checking Gradle Projects:"
          echo "=========================================="
          ./gradlew projects

      - name: 7. Pre-Build Verification: Gradle Tasks
        run: |
          cd android
          echo "=========================================="
          echo "Listing and Verifying Gradle Tasks:"
          echo "=========================================="
          TASKS_OUTPUT=$(./gradlew tasks --all)
          
          # Confirm :app and assemble tasks exist
          if ! echo "$TASKS_OUTPUT" | grep -E "(assembleDebug|:app:assembleDebug)"; then
            echo "ERROR: assembleDebug task missing from Gradle configuration!"
            exit 1
          fi
          
          if ! echo "$TASKS_OUTPUT" | grep -E "(assembleRelease|:app:assembleRelease)"; then
            echo "ERROR: assembleRelease task missing from Gradle configuration!"
            exit 1
          fi
          
          echo "SUCCESS: Required Gradle tasks (:app, :app:assembleDebug, :app:assembleRelease) confirmed."

      - name: 8. Build Production Android APK (:app:assembleRelease)
        run: |
          cd android
          echo "=========================================="
          echo "Building Production APK with: ./gradlew :app:assembleRelease"
          echo "=========================================="
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 9. Sign Production Release APK Securely
        run: |
          mkdir -p release-output
          
          # Locate built release APK
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Release APK binary was not generated at android/app/build/outputs/apk/release/!"
            exit 1
          fi
          echo "Located generated release APK at: $RAW_APK"
          
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"
          cp "$RAW_APK" "$TARGET_APK"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$TARGET_APK" "${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            echo "Generating secure release signing keystore..."
            keytool -genkey -v -keystore release.keystore -alias mkuu_ai_master_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "MkuuAiMasterRelease2026" -keypass "MkuuAiMasterRelease2026" \
              -dname "CN=Max, OU=MKUU AI, O=MKUU, L=DarEsSalaam, ST=Tanzania, C=TZ"
            
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "MkuuAiMasterRelease2026" \
              -keypass "MkuuAiMasterRelease2026" \
              "$TARGET_APK" mkuu_ai_master_key
          fi

      - name: 10. Strict APK Validation & Structural Inspection
        run: |
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"
          
          echo "=========================================="
          echo "APK Validation Check: Existence and File Size"
          echo "=========================================="
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK does not exist!"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || wc -c < "$TARGET_APK")
          if [ "$APK_SIZE" -le 10000 ]; then
            echo "ERROR: APK size ($APK_SIZE bytes) is invalid or empty!"
            exit 1
          fi
          echo "APK Size: $APK_SIZE bytes (~$(($APK_SIZE / 1024 / 1024)) MB)"

          echo "=========================================="
          echo "APK Validation Check: Internal Package Structure"
          echo "=========================================="
          APK_CONTENTS=$(unzip -l "$TARGET_APK")
          
          # Check AndroidManifest.xml
          if ! echo "$APK_CONTENTS" | grep -q "AndroidManifest.xml"; then
            echo "ERROR: AndroidManifest.xml missing inside APK!"
            exit 1
          fi
          echo "✓ AndroidManifest.xml verified"
          
          # Check classes.dex
          if ! echo "$APK_CONTENTS" | grep -q "classes.dex"; then
            echo "ERROR: classes.dex missing inside APK!"
            exit 1
          fi
          echo "✓ classes.dex verified"
          
          # Check resources.arsc
          if ! echo "$APK_CONTENTS" | grep -q "resources.arsc"; then
            echo "ERROR: resources.arsc missing inside APK!"
            exit 1
          fi
          echo "✓ resources.arsc verified"

          echo "=========================================="
          echo "APK Validation Check: Package Details"
          echo "=========================================="
          if grep -q 'package="com.mkuu.ai"' android/app/src/main/AndroidManifest.xml || grep -q 'applicationId "com.mkuu.ai"' android/app/build.gradle; then
            echo "✓ Package Name confirmed: com.mkuu.ai"
          else
            echo "ERROR: Package name com.mkuu.ai not found in configuration!"
            exit 1
          fi

          echo "=========================================="
          echo "APK Validation Check: Digital Signature"
          echo "=========================================="
          if ! jarsigner -verify -verbose -certs "$TARGET_APK" | grep -E "jar verified|Signature verified"; then
            echo "ERROR: APK signature verification failed!"
            exit 1
          fi
          echo "✓ APK signature verified successfully."

          echo "=========================================="
          echo "ALL VALIDATIONS PASSED: MkuuAI_Master_v1.0.0_Signed.apk"
          echo "=========================================="

      - name: 11. Upload Verified Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed.apk
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: error
