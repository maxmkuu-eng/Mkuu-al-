name: Build and Validate Android Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify-apk:
    name: Build, Sign & Validate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 5. Verify Java and Gradle
        run: |
          echo "========================================"
          echo "Java Version"
          echo "========================================"
          java -version

          echo "========================================"
          echo "Gradle Version"
          echo "========================================"
          gradle --version

      - name: 6. Verify Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle settings file was not found."
            exit 1
          fi

          echo "Android project detected successfully."

      - name: 7. Check Android Gradle Projects
        run: |
          cd android
          gradle projects --no-daemon

      - name: 8. Check Required Gradle Tasks
        run: |
          cd android

          echo "========================================"
          echo "Checking Gradle Tasks"
          echo "========================================"

          TASKS_OUTPUT="$(gradle tasks --all --no-daemon)"

          echo "$TASKS_OUTPUT"

          if ! echo "$TASKS_OUTPUT" | grep -E "(assembleDebug|:app:assembleDebug)" >/dev/null; then
            echo "ERROR: assembleDebug task was not found."
            exit 1
          fi

          if ! echo "$TASKS_OUTPUT" | grep -E "(assembleRelease|:app:assembleRelease)" >/dev/null; then
            echo "ERROR: assembleRelease task was not found."
            exit 1
          fi

          echo "Required Android Gradle tasks confirmed."

      - name: 9. Build Release APK
        run: |
          cd android

          echo "========================================"
          echo "Building Release APK"
          echo "========================================"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: 10. Locate Generated APK
        run: |
          mkdir -p release-output

          echo "Searching for generated APK..."

          RAW_APK="$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Release APK was not generated."
            echo "Searching entire build directory:"
            find android/app/build -type f -name "*.apk" || true
            exit 1
          fi

          echo "Generated APK:"
          echo "$RAW_APK"

          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          cp "$RAW_APK" "$TARGET_APK"

          echo "Prepared APK:"
          ls -lh "$TARGET_APK"

      - name: 11. Generate Release Signing Key
        run: |
          echo "Generating release signing key..."

          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias mkuu_ai_master_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MkuuAiMasterRelease2026" \
            -keypass "MkuuAiMasterRelease2026" \
            -dname "CN=Max, OU=MKUU AI, O=MKUU, L=DarEsSalaam, ST=Tanzania, C=TZ"

      - name: 12. Sign Release APK
        run: |
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: APK not found before signing."
            exit 1
          fi

          echo "Signing APK..."

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "MkuuAiMasterRelease2026" \
            -keypass "MkuuAiMasterRelease2026" \
            "$TARGET_APK" \
            mkuu_ai_master_key

          echo "APK signing completed."

      - name: 13. Verify APK Signature
        run: |
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          echo "Verifying APK signature..."

          jarsigner -verify -verbose -certs "$TARGET_APK"

          echo "APK signature verification completed."

      - name: 14. Validate APK File
        run: |
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          echo "========================================"
          echo "APK Validation"
          echo "========================================"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: APK does not exist."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$TARGET_APK")

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -le 10000 ]; then
            echo "ERROR: APK is too small or empty."
            exit 1
          fi

          APK_CONTENTS="$(unzip -l "$TARGET_APK")"

          echo "Checking AndroidManifest.xml..."

          if ! echo "$APK_CONTENTS" | grep -q "AndroidManifest.xml"; then
            echo "ERROR: AndroidManifest.xml is missing."
            exit 1
          fi

          echo "Checking classes.dex..."

          if ! echo "$APK_CONTENTS" | grep -q "classes.dex"; then
            echo "ERROR: classes.dex is missing."
            exit 1
          fi

          echo "APK basic structure validated successfully."

      - name: 15. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: error
