name: Build and Validate Android Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify-apk:
    name: Build MKUU AI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Node Dependencies
        run: |
          set -e
          npm install

      - name: 6. Verify Capacitor
        run: |
          set -e
          npx cap --version
          test -d node_modules/@capacitor/android
          echo "Capacitor Android package found."

      - name: 7. Sync Capacitor Android
        run: |
          set -e
          npx cap sync android

      - name: 8. Install Gradle 8.13 Directly
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.13"
          ZIP="$RUNNER_TEMP/gradle-${VERSION}-bin.zip"
          INSTALL="$RUNNER_TEMP/gradle"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$ZIP"

          mkdir -p "$INSTALL"

          unzip -q "$ZIP" -d "$INSTALL"

          echo "$INSTALL/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle $VERSION installed."

      - name: 9. Verify Build Environment
        run: |
          set -e

          echo "===== Node ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

      - name: 10. Verify Capacitor Android Project
        run: |
          set -e

          test -d android
          test -f android/settings.gradle
          test -d node_modules/@capacitor/android

          echo "Android project:"
          ls -la android

          echo "Capacitor Android:"
          ls -la node_modules/@capacitor/android

      - name: 11. Verify Gradle Projects
        working-directory: android
        run: |
          set -e
          gradle projects --no-daemon --stacktrace

      - name: 12. Build Release APK
        working-directory: android
        run: |
          set -e

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: 13. Find Release APK
        shell: bash
        run: |
          set -e

          mkdir -p release-output

          APK="$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" \
            "release-output/MkuuAI_Master_v1.0.0.apk"

          ls -lh release-output/

      - name: 14. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0
          path: release-output/MkuuAI_Master_v1.0.0.apk
          retention-days: 30
          if-no-files-found: error
