name: MKUU AI - Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  GRADLE_VERSION: "8.13"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build MKUU AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          ZIP="$RUNNER_TEMP/gradle.zip"
          DIR="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$ZIP"

          unzip -q "$ZIP" -d "$RUNNER_TEMP"

          echo "$DIR/bin" >> "$GITHUB_PATH"

          "$DIR/bin/gradle" --version

      - name: Install npm dependencies
        shell: bash
        run: |
          set -e
          npm install --no-audit --no-fund

      - name: Build web application
        shell: bash
        run: |
          set -e
          npm run build

          test -f dist/index.html

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          npx cap sync android

      # ------------------------------------------------------------
      # REPAIR ANDROID IMAGE RESOURCES
      # ------------------------------------------------------------

      - name: Repair Android image resources
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import struct
          import zlib

          ROOT = Path("android/app/src/main/res")

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"

          def chunk(name, data):
              return (
                  struct.pack(">I", len(data))
                  + name
                  + data
                  + struct.pack(">I", zlib.crc32(name + data) & 0xffffffff)
              )

          def create_png(width, height, mode):
              rows = []

              for y in range(height):
                  row = bytearray()
                  row.append(0)

                  for x in range(width):

                      if mode == "launcher":
                          # Simple opaque blue launcher background.
                          r = 25
                          g = 70
                          b = 140
                          a = 255

                      elif mode == "foreground":
                          # Transparent background with a white circle.
                          cx = width / 2
                          cy = height / 2
                          radius = width * 0.32

                          inside = (
                              (x - cx) ** 2 +
                              (y - cy) ** 2
                              <= radius ** 2
                          )

                          if inside:
                              r, g, b, a = 255, 255, 255, 255
                          else:
                              r, g, b, a = 0, 0, 0, 0

                      else:
                          # Splash screen.
                          r = 25
                          g = 70
                          b = 140
                          a = 255

                      row.extend((r, g, b, a))

                  rows.append(bytes(row))

              raw = b"".join(rows)

              return (
                  PNG_SIGNATURE
                  + chunk(
                      b"IHDR",
                      struct.pack(
                          ">IIBBBBB",
                          width,
                          height,
                          8,
                          6,
                          0,
                          0,
                          0
                      )
                  )
                  + chunk(b"IDAT", zlib.compress(raw, 9))
                  + chunk(b"IEND", b"")
              )

          launcher_names = {
              "ic_launcher.png",
              "ic_launcher_round.png",
          }

          foreground_names = {
              "ic_launcher_foreground.png",
          }

          splash_names = {
              "splash.png",
          }

          repaired = 0

          for path in ROOT.rglob("*.png"):

              name = path.name

              # Only replace Android-generated launcher/splash resources.
              if name in launcher_names:
                  data = create_png(192, 192, "launcher")

              elif name in foreground_names:
                  data = create_png(192, 192, "foreground")

              elif name in splash_names:
                  data = create_png(480, 800, "splash")

              else:
                  continue

              path.write_bytes(data)

              print("REPAIRED:", path)

              repaired += 1

          print("Total repaired:", repaired)
          PY

      - name: Verify Android PNG resources
        shell: bash
        run: |
          set -e

          echo "Checking Android PNG resources..."

          find android/app/src/main/res \
            -type f \
            -name "*.png" \
            -print

          while IFS= read -r file; do

            test -s "$file"

            file "$file" | grep -qi "PNG image data" || {
              echo "INVALID PNG:"
              echo "$file"
              exit 1
            }

            echo "OK: $file"

          done < <(
            find android/app/src/main/res \
              -type f \
              -name "*.png"
          )

          echo "All PNG resources are valid."

      # ------------------------------------------------------------
      # ANDROID BUILD
      # ------------------------------------------------------------

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        shell: bash
        run: |
          set -e

          mkdir -p release-output

          APK="$(
            find android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            release-output/MkuuAI_Master_v1.0.0.apk

      # ------------------------------------------------------------
      # SIGN APK
      # ------------------------------------------------------------

      - name: Sign APK
        shell: bash
        run: |
          set -e

          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          APKSIGNER="$TOOLS/apksigner"
          ZIPALIGN="$TOOLS/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          INPUT="release-output/MkuuAI_Master_v1.0.0.apk"
          ALIGNED="$RUNNER_TEMP/MkuuAI-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/mkuu-ai.keystore"

          "$ZIPALIGN" \
            -f 4 \
            "$INPUT" \
            "$ALIGNED"

          PASSWORD="$(openssl rand -hex 24)"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias mkuu_ai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mkuu AI, O=Mkuu AI, C=TZ"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias mkuu_ai \
            --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" \
            --out \
            release-output/MkuuAI_Master_v1.0.0_Signed.apk \
            "$ALIGNED"

          "$APKSIGNER" verify \
            --verbose \
            release-output/MkuuAI_Master_v1.0.0_Signed.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          test -s "$APK"

          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"

          ls -lh "$APK"

          echo "======================================"
          echo "MKUU AI APK BUILD SUCCESSFUL"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: error
