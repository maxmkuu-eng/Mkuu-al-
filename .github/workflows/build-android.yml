name: MKUU AI — Android Release APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  GRADLE_VERSION: "8.13"
  ANDROID_API: "36"

jobs:
  build-android:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Android SDK 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;36.0.0"

      - name: 6. Install Gradle 8.13 directly
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"

          rm -rf "$GRADLE_HOME"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          "$GRADLE_HOME/bin/gradle" --version

      - name: 7. Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Node ====="
          node --version
          echo "===== NPM ====="
          npm --version
          echo "===== Java ====="
          java -version
          echo "===== Gradle ====="
          gradle --version

      - name: 8. Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: 9. Verify Capacitor Android package
        shell: bash
        run: |
          set -euo pipefail
          npx cap --version
          test -d node_modules/@capacitor/android
          test -d android
          echo "Capacitor Android package and Android project are present."

      - name: 10. Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: 11. Verify web assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          echo "dist/index.html exists."

      - name: 12. Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: 13. Verify Android project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/capacitor.settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q "include ':capacitor-android'" android/capacitor.settings.gradle
          echo "Android project configuration verified."

      - name: 14. Clean Android project with system Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace

      - name: 15. Build release APK with system Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: 16. Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find android/app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Release APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: 17. Sign APK with apksigner
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          mkdir -p release-output
          ALIGNED_APK="$RUNNER_TEMP/MkuuAI-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/mkuu-ai-release.keystore"

          "$ZIPALIGN" -f 4 "$APK_PATH" "$ALIGNED_APK"

          if [ -n "${KEYSTORE_B64:-}" ] && \
             [ -n "${KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${KEY_PASSWORD:-}" ] && \
             [ -n "${KEY_ALIAS:-}" ]; then

            echo "Using GitHub Actions release signing secrets."

            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

            SIGN_STOREPASS="$KEYSTORE_PASSWORD"
            SIGN_KEYPASS="$KEY_PASSWORD"
            SIGN_ALIAS="$KEY_ALIAS"

          else

            echo "No release keystore secrets configured."
            echo "Generating temporary CI signing key."

            SIGN_STOREPASS="$(openssl rand -hex 24)"
            SIGN_KEYPASS="$SIGN_STOREPASS"
            SIGN_ALIAS="mkuu_ai_key"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "$SIGN_STOREPASS" \
              -keypass "$SIGN_KEYPASS" \
              -alias "$SIGN_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Mkuu AI, OU=MkuuAI, O=Mkuu, L=Dar es Salaam, ST=Tanzania, C=TZ"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass "pass:$SIGN_STOREPASS" \
            --key-pass "pass:$SIGN_KEYPASS" \
            --out "release-output/MkuuAI_Master_v1.0.0_Signed.apk" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify \
            --verbose \
            "release-output/MkuuAI_Master_v1.0.0_Signed.apk"

      - name: 18. Validate final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          test -s "$APK"

          SIZE="$(wc -c < "$APK")"

          if [ "$SIZE" -le 10000 ]; then
            echo "ERROR: APK is unexpectedly small: $SIZE bytes"
            exit 1
          fi

          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'

          echo "=============================================="
          echo "SUCCESS: MkuuAI_Master_v1.0.0_Signed.apk"
          echo "Package: com.mkuu.ai"
          echo "Size: $SIZE bytes"
          echo "=============================================="

      - name: 19. Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: error
