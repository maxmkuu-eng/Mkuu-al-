name: Build and Validate Android Release APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-verify-apk:
    name: Build, Sign & Validate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 5. Verify Gradle
        run: |
          gradle --version

      - name: 6. Verify Android Project
        run: |
          cd android
          gradle projects

      - name: 7. Verify Required Tasks
        run: |
          cd android
          TASKS_OUTPUT="$(gradle tasks --all)"

          echo "$TASKS_OUTPUT"

          if ! echo "$TASKS_OUTPUT" | grep -E "(assembleDebug|:app:assembleDebug)"; then
            echo "ERROR: assembleDebug task missing!"
            exit 1
          fi

          if ! echo "$TASKS_OUTPUT" | grep -E "(assembleRelease|:app:assembleRelease)"; then
            echo "ERROR: assembleRelease task missing!"
            exit 1
          fi

          echo "Required Android Gradle tasks confirmed."

      - name: 8. Build Production APK
        run: |
          cd android
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 9. Locate and Prepare APK
        run: |
          mkdir -p release-output

          RAW_APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Found APK: $RAW_APK"

          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"
          cp "$RAW_APK" "$TARGET_APK"

          echo "APK prepared: $TARGET_APK"

      - name: 10. Generate Release Signing Key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias mkuu_ai_master_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MkuuAiMasterRelease2026" \
            -keypass "MkuuAiMasterRelease2026" \
            -dname "CN=Max, OU=MKUU AI, O=MKUU, L=DarEsSalaam, ST=Tanzania, C=TZ"

      - name: 11. Sign APK
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "MkuuAiMasterRelease2026" \
            -keypass "MkuuAiMasterRelease2026" \
            "release-output/MkuuAI_Master_v1.0.0_Signed.apk" \
            mkuu_ai_master_key

      - name: 12. Validate APK
        run: |
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: APK does not exist!"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$TARGET_APK")

          if [ "$APK_SIZE" -le 10000 ]; then
            echo "ERROR: APK is too small or empty."
            exit 1
          fi

          echo "APK size: $APK_SIZE bytes"

          APK_CONTENTS="$(unzip -l "$TARGET_APK")"

          if ! echo "$APK_CONTENTS" | grep -q "AndroidManifest.xml"; then
            echo "ERROR: AndroidManifest.xml missing!"
            exit 1
          fi

          if ! echo "$APK_CONTENTS" | grep -q "classes.dex"; then
            echo "ERROR: classes.dex missing!"
            exit 1
          fi

          if ! echo "$APK_CONTENTS" | grep -q "resources.arsc"; then
            echo "ERROR: resources.arsc missing!"
            exit 1
          fi

          echo "APK structure validated successfully."

          if ! jarsigner -verify "release-output/MkuuAI_Master_v1.0.0_Signed.apk"; then
            echo "ERROR: APK signature verification failed!"
            exit 1
          fi

          echo "APK signature verified successfully."

      - name: 13. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: errorster_v1.0.0_Signed.apk
          path: relea
