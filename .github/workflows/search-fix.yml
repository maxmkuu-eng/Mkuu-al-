name: Search fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: live search' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/search_fix.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/geminiService.ts
          git rm .github/workflows/search-fix.yml .github/scripts/search_fix.py
          git commit -m "fix: live search"
          git push
# trigger live-search patch
