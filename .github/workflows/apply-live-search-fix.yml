name: Apply Tavily authoritative live search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: Tavily authoritative runtime flow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Backend: make Tavily the only web-search authority.
          p = Path('server/geminiService.ts')
          s = p.read_text()
          s = s.replace("export const LIVE_SEARCH_MODEL = 'gemini-3.6-flash';", "export const LIVE_SEARCH_MODEL = PERSONAL_CHAT_MODEL;")

          # Current/social terms that were missing from search intent.
          m = re.search(r"const searchKeywords = \[(.*?)\];", s, re.S)
          if not m:
              raise SystemExit('searchKeywords array not found')
          extra = "'amejifungua','amepata mtoto','mtoto wa','ujauzito','pregnancy','pregnant','baby','birth','zuchu','diamond','msanii','celebrity','artist','singer','actor','actress','social media','instagram','facebook','tiktok','youtube','twitter','x.com','official statement','post ya','statement ya','today','yesterday','tomorrow','what happened','nani ni','who is','price','cost','salary','appointed','resigned','died','death'"
          body = m.group(1)
          if 'amejifungua' not in body:
              s = s[:m.start(1)] + body + ',' + extra + s[m.end(1):]

          s = s.replace("const isSearchQuery = this.detectSearchIntent(message);", "const isSearchQuery = this.detectSearchIntent(message);", 1)

          # Live synthesis must not receive old conversation history or MAX memory.
          start = s.find('        const groundedSystemPrompt =')
          end = s.find('        if (!aiReplyText?.trim())', start)
          if start < 0 or end < 0:
              raise SystemExit('Tavily synthesis block not found')
          replacement = '''        const groundedSystemPrompt = `Wewe ni MKUU AI. LIVE TAVILY EVIDENCE ndiyo chanzo pekee cha taarifa za sasa. Usitumie conversation history, MAX memory, Google Search, browsing, au maarifa ya zamani ya model kuthibitisha current facts. Usibuni dai lisilothibitishwa na evidence. Kama evidence haitoshi, sema wazi kuwa ushahidi wa kuaminika haujatosha. Chagua chanzo kipya na chenye mamlaka zaidi pale vyanzo vinapotofautiana. Jibu kwa Kiswahili fasaha. Muda wa server: ${getCurrentTanzaniaTimeContext().formattedString}`;
        const groundedContents = [{ role: 'user' as const, parts: [{ text: `${message}\\n\\n[LIVE TAVILY EVIDENCE — USE THIS ONLY]\\n${tavilyResults}` }] }];
        aiReplyText = await this.executeGeminiCallWithFallback({ contents: groundedContents, config: { systemInstruction: groundedSystemPrompt, temperature: 0.2 }, preferredModel: LIVE_SEARCH_MODEL, authoritativeTavily: true });
'''
          s = s[:start] + replacement + s[end:]

          # No Google Search fallback after Tavily failure.
          start = s.find('        // Secondary fallback: Google Search grounding.')
          end = s.find('      }\n\n      console.log', start)
          if start < 0 or end < 0:
              raise SystemExit('Tavily Google fallback block not found')
          s = s[:start] + "        throw new Error(`LIVE_SEARCH_UNAVAILABLE: Tavily search failed; refusing stale Gemini answer. ${tavilyMsg}`);\n" + s[end:]

          # No Google Search retry for ordinary chat either.
          start = s.find('        if (this.isInsufficientKnowledgeResponse(aiReplyText)) {')
          end = s.find('        console.log(`[MKUU-BACKEND] [GEMINI_RESPONSE_RECEIVED]', start)
          if start >= 0 and end >= 0:
              s = s[:start] + s[end:]

          s = s.replace(
              "private async executeGeminiCallWithFallback(params: { contents: any; config?: any; preferredModel?: string }): Promise<string> {",
              "private async executeGeminiCallWithFallback(params: { contents: any; config?: any; preferredModel?: string; authoritativeTavily?: boolean }): Promise<string> {",
              1,
          )
          s = s.replace(
              "const modelsToTry = params.config?.tools ? [preferred] : [preferred, ...CHAT_MODEL_FALLBACKS.filter((m) => m !== preferred)];",
              "const modelsToTry = params.authoritativeTavily ? [preferred] : (params.config?.tools ? [preferred] : [preferred, ...CHAT_MODEL_FALLBACKS.filter((m) => m !== preferred)]);",
              1,
          )
          p.write_text(s)

          # 2) API server: never rewrite current questions into Google Search prompts; return Tavily sources.
          p = Path('server.ts')
          s = p.read_text()
          if "getLastTavilySources" not in s:
              s = s.replace(
                  "import { geminiService, PERSONAL_CHAT_MODEL, AI_PROVIDER, BACKEND_IDENTIFIER } from './server/geminiService.js';",
                  "import { geminiService, PERSONAL_CHAT_MODEL, AI_PROVIDER, BACKEND_IDENTIFIER } from './server/geminiService.js';\nimport { getLastTavilySources } from './server/tavilySearch.js';",
                  1,
              )
          start = s.find('    // Current/changing facts must be grounded with live Google Search.')
          end = s.find('    const result=await geminiService.processChat', start)
          if start >= 0 and end >= 0:
              s = s[:start] + s[end:]
          s = s.replace('message:searchMessage,conversationHistory:effectiveHistory', 'message,conversationHistory:effectiveHistory', 1)
          s = s.replace(
              'latencyMs:result.latencyMs};',
              'latencyMs:result.latencyMs,webSources:getLastTavilySources()};',
              1,
          )
          p.write_text(s)

          # 3) Client: live/current questions must bypass any stored direct Gemini key.
          p = Path('src/services/aiEngine.ts')
          s = p.read_text()
          s = s.replace(
              "  if (directApiKey && directApiKey.trim().length > 10) return callDirectGemini(directApiKey.trim(), params);",
              "  if (directApiKey && directApiKey.trim().length > 10 && !needsLiveSearch(params.message)) return callDirectGemini(directApiKey.trim(), params);",
              1,
          )
          s = s.replace(
              "  intent?: string;\n}",
              "  intent?: string;\n  webSources?: Array<{ title: string; url: string }>;\n}",
              1,
          )
          s = s.replace(
              "    intent: serverRes.intent || 'chat',\n  };",
              "    intent: serverRes.intent || 'chat',\n    webSources: serverRes.webSources || [],\n  };",
              1,
          )
          p.write_text(s)
      - name: Validate
        run: |
          npm ci
          npm run build
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/geminiService.ts server.ts src/services/aiEngine.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: Tavily authoritative runtime flow"
          git push
