name: MKUU AI — Android Release APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK & Tools
        uses: android-actions/setup-android@v3

      - name: 4. Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: 5. Verify Gradle Environment & Tasks
        run: |
          cd android
          ./gradlew --version
          ./gradlew projects
          ./gradlew tasks --all

      - name: 6. Build Android Release APK (:app:assembleRelease)
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 7. Sign Release APK Securely
        run: |
          mkdir -p release-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not generated!"
            exit 1
          fi
          echo "Found compiled APK at: $APK_PATH"
          
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"
          cp "$APK_PATH" "$TARGET_APK"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom GitHub Actions Secret release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$TARGET_APK" "${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            echo "Generating secure release signing keystore for automated CI/CD artifact..."
            keytool -genkey -v -keystore release.keystore -alias mkuu_ai_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "MkuuAiSecureKeyPass2026" -keypass "MkuuAiSecureKeyPass2026" \
              -dname "CN=Max, OU=MkuuAI, O=Mkuu, L=DarEsSalaam, ST=Tanzania, C=TZ"
            
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "MkuuAiSecureKeyPass2026" \
              -keypass "MkuuAiSecureKeyPass2026" \
              "$TARGET_APK" mkuu_ai_key
          fi

      - name: 8. Strict APK Validation & Structural Inspection
        run: |
          TARGET_APK="release-output/MkuuAI_Master_v1.0.0_Signed.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Final signed $TARGET_APK not found!"
            exit 1
          fi
          FILE_SIZE=$(wc -c < "$TARGET_APK")
          if [ "$FILE_SIZE" -le 10000 ]; then
            echo "Error: Generated APK is too small or empty ($FILE_SIZE bytes)!"
            exit 1
          fi
          
          # Structural checks
          APK_FILES=$(unzip -l "$TARGET_APK")
          if ! echo "$APK_FILES" | grep -q "AndroidManifest.xml"; then
            echo "Error: AndroidManifest.xml missing inside APK!"
            exit 1
          fi
          if ! echo "$APK_FILES" | grep -q "classes.dex"; then
            echo "Error: classes.dex missing inside APK!"
            exit 1
          fi
          if ! echo "$APK_FILES" | grep -q "resources.arsc"; then
            echo "Error: resources.arsc missing inside APK!"
            exit 1
          fi
          
          # Signature check
          if ! jarsigner -verify "$TARGET_APK" | grep -E "jar verified|Signature verified"; then
            echo "Error: APK signature verification failed!"
            exit 1
          fi
          
          echo "=============================================="
          echo "SUCCESS: MkuuAI_Master_v1.0.0_Signed.apk verified!"
          echo "Package: com.mkuu.ai"
          echo "Size: $FILE_SIZE bytes"
          echo "=============================================="

      - name: 9. Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MkuuAI_Master_v1.0.0_Signed.apk
          path: release-output/MkuuAI_Master_v1.0.0_Signed.apk
          retention-days: 30
          if-no-files-found: error
