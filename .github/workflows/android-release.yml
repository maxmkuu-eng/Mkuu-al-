name: MKUU AI — Android Release APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 5. Verify package.json & package-lock.json
        run: |
          if [ ! -f package.json ]; then
            echo "Error: package.json not found!"
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "Error: package-lock.json not found!"
            exit 1
          fi
          echo "Verified package.json and package-lock.json successfully."

      - name: 6. Install Node dependencies
        run: npm ci

      - name: 7. Build Web Production Bundle
        run: npm run build

      - name: 8. Sync Web Assets with Native Android Project
        run: npx cap sync android

      - name: 9. Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: 10. Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 11. Sign Release APK Securely
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not generated!"
            exit 1
          fi
          echo "Found compiled APK at: $APK_PATH"
          
          # Create dedicated release directory
          mkdir -p release-output
          
          # Check if custom production signing secrets exist, else generate a secure release keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom GitHub Actions Secret release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$APK_PATH" "${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            echo "Generating secure release signing keystore for automated CI/CD artifact..."
            keytool -genkey -v -keystore release.keystore -alias mkuu_ai_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "MkuuAiSecureKeyPass2026" -keypass "MkuuAiSecureKeyPass2026" \
              -dname "CN=Max, OU=MkuuAI, O=Mkuu, L=DarEsSalaam, ST=Tanzania, C=TZ"
            
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "MkuuAiSecureKeyPass2026" \
              -keypass "MkuuAiSecureKeyPass2026" \
              "$APK_PATH" mkuu_ai_key
          fi

          # Align & copy to official release artifact name
          cp "$APK_PATH" release-output/Mkuu-AI-release.apk

      - name: 12. Verify Signed Release APK
        run: |
          if [ ! -f release-output/Mkuu-AI-release.apk ]; then
            echo "Error: Final signed Mkuu-AI-release.apk not found!"
            exit 1
          fi
          FILE_SIZE=$(wc -c < release-output/Mkuu-AI-release.apk)
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "Error: Generated APK is empty (0 bytes)!"
            exit 1
          fi
          echo "=============================================="
          echo "SUCCESS: Mkuu-AI-release.apk verified!"
          echo "Package: com.mkuu.ai"
          echo "Size: $FILE_SIZE bytes"
          echo "=============================================="

      - name: 13. Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mkuu-AI-release-apk
          path: release-output/Mkuu-AI-release.apk
          retention-days: 30
          if-no-files-found: error
