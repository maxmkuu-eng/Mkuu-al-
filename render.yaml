services:
  - type: web
    name: mkuu-ai-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run build:server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
